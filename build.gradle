plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

javafx {
    version = "17.0.10"
    modules = [ 'javafx.controls' ]
}

application {
    mainClass = 'AppLauncher' // UPDATED HERE
}

tasks.named('jar') {
    archiveFileName = 'HauntedHouseProject.jar'
}

tasks.register('packageApp', Exec) {
    dependsOn installDist
    workingDir = project.projectDir
    
    doFirst {
        project.delete "${buildDir}/dist/HauntedHouse"
    }
    
    def inputLibs = "${buildDir}/install/${project.name}/lib"

    commandLine = [
        'jpackage',
        '--type', 'app-image',
        '--dest', "${buildDir}/dist",
        '--name', 'HauntedHouse',
        '--app-version', '1.0.0',
        '--input', inputLibs,
        '--main-jar', "HauntedHouseProject.jar",
        '--main-class', 'AppLauncher' // UPDATED HERE
    ]

    doLast {
        println "🎉 Success! Standalone binary created at: build/dist/HauntedHouse/"
    }
}